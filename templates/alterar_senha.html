{% extends "base.html" %}
{% block title %}Alterar senha{% endblock %}
{% block content %}
<div class="card p-3 p-lg-4 mx-auto" style="max-width: 480px;">
  <h5 class="fw-semibold mb-3">Alterar senha</h5>
  <form method="post">
    <div class="mb-3">
      <label class="form-label">Senha atual</label>
      <input type="password" name="senha_atual" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Nova senha</label>
      <input type="password" name="senha_nova" class="form-control" required minlength="6">
    </div>
    <div class="mb-3">
      <label class="form-label">Confirmar nova senha</label>
      <input type="password" name="senha_confirma" class="form-control" required minlength="6">
    </div>
    <button type="submit" class="btn btn-primary">Salvar</button>
  </form>
</div>
{% endblock %}
