{% extends "base.html" %}
{% block title %}Calendário{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
  <h5 class="fw-semibold mb-0"><i class="bi bi-calendar3 me-1"></i>Calendário</h5>
  <select id="space-filter" class="form-select form-select-sm" style="max-width: 220px;">
    <option value="">Todos os espaços</option>
    {% for s in spaces %}
    <option value="{{ s.id }}">{{ s.name }}</option>
    {% endfor %}
  </select>
</div>

<div class="card p-2 p-lg-3">
  <div id="calendar"></div>
</div>
{% endblock %}

{% block scripts %}
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const calendarEl = document.getElementById('calendar');
  const isMobile = window.innerWidth < 768;
  const calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: isMobile ? 'listWeek' : 'dayGridMonth',
    locale: 'pt-br',
    height: 'auto',
    headerToolbar: {
      left: 'prev,next today',
      center: 'title',
      right: isMobile ? 'dayGridMonth,listWeek' : 'dayGridMonth,timeGridWeek,listWeek'
    },
    buttonText: { today: 'Hoje', month: 'Mês', week: 'Semana', list: 'Lista' },
    events: function(info, successCallback, failureCallback) {
      const spaceId = document.getElementById('space-filter').value;
      let url = "{{ url_for('api_reservas') }}";
      if (spaceId) url += "?space_id=" + spaceId;
      fetch(url).then(r => r.json()).then(successCallback).catch(failureCallback);
    },
    dateClick: function(info) {
      window.location = "{{ url_for('reserva_nova') }}?date=" + info.dateStr;
    }
  });
  calendar.render();
  document.getElementById('space-filter').addEventListener('change', () => calendar.refetchEvents());
});
</script>
{% endblock %}
