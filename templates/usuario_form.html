{% extends "base.html" %}
{% block title %}Usuário{% endblock %}
{% block content %}
{% set f = form or usuario %}
<div class="card p-3 p-lg-4 mx-auto" style="max-width: 480px;">
  <h5 class="fw-semibold mb-3">{{ 'Editar usuário' if usuario else 'Novo usuário' }}</h5>
  <form method="post">
    <div class="mb-3">
      <label class="form-label">Nome</label>
      <input type="text" name="name" class="form-control" required value="{{ f.name if f else '' }}">
    </div>
    <div class="mb-3">
      <label class="form-label">E-mail</label>
      <input type="email" name="email" class="form-control" required value="{{ f.email if f else '' }}">
    </div>
    <div class="mb-3">
      <label class="form-label">{{ 'Nova senha' if usuario else 'Senha' }}</label>
      <input type="password" name="senha" class="form-control" {% if not usuario %}required{% endif %} minlength="6">
      {% if usuario %}<small class="text-muted">Deixe em branco para manter a senha atual.</small>{% endif %}
    </div>
    <div class="mb-3">
      <label class="form-label">Confirmar senha</label>
      <input type="password" name="senha_confirma" class="form-control" {% if not usuario %}required{% endif %} minlength="6">
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">Salvar</button>
      <a href="{{ url_for('usuarios_list') }}" class="btn btn-outline-secondary">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
